version: 2

project_name: nanoflux

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: nanoflux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

dockers_v2:
  - images:
      - "ghcr.io/metruzanca/nanoflux"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"

release:
  github:
    owner: metruzanca
    name: nanoflux

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"