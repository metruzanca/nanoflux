version: 2

project_name: nanoflux

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: nanoflux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

dockers_v2:
  - images:
      - "ghcr.io/metruzanca/nanoflux"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"

release:
  github:
    owner: metruzanca
    name: nanoflux
  footer: |

    ## Containers

    This release ships as container images only — no binaries are published.
    Find the images on the package registry:

    [ghcr.io/metruzanca/nanoflux](https://github.com/users/metruzanca/packages/container/package/nanoflux)

    ```sh
    docker pull ghcr.io/metruzanca/nanoflux:{{ .Tag }}
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"