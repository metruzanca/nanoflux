version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/schema.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        emit_json_tags: true
        overrides:
          # Bools are stored as INTEGER 0/1; map them to Go bool.
          - column: "items.read"
            go_type: "bool"
          - column: "items.favorite"
            go_type: "bool"
          - column: "feeds.enabled"
            go_type: "bool"