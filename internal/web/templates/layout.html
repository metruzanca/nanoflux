{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} — {{end}}rss</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
{{end}}

{{define "topbar"}}
<header class="top">
  <a class="brand" href="/">rss</a>
  {{if .User.ID}}
  <nav>
    <a href="/feeds">feeds</a>
    <a href="/authors">authors</a>
    <a href="/collections">collections</a>
    <form action="/logout" method="post" class="inline"><button class="link" type="submit">log out</button></form>
  </nav>
  {{end}}
</header>

<dialog id="item-dialog" class="modal wide">
  <div class="row">
    <h2 class="muted">item</h2>
    <div class="row-actions">
      <a id="item-dialog-live" class="small" href="#" target="_blank" rel="noopener">open live ↗</a>
      <button type="button" class="link" onclick="document.getElementById('item-dialog').close()">✕</button>
    </div>
  </div>
  <iframe id="item-dialog-frame" src="about:blank" title="item preview" sandbox></iframe>
</dialog>
<script>
function openItem(el) {
  document.getElementById('item-dialog-live').href = el.dataset.itemLink;
  document.getElementById('item-dialog-frame').src = '/items/' + el.dataset.itemId + '/view';
  document.getElementById('item-dialog').showModal();
  return false;
}
</script>
{{end}}
