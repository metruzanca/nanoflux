{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} — {{end}}nanoflux</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script>
document.addEventListener('htmx:beforeSwap', function (e) {
  if (e.detail.xhr.status >= 400) e.detail.shouldSwap = true;
});
</script>
{{end}}

{{define "topbar"}}
<header class="top">
  <a class="brand" href="/">nanoflux</a>
  {{if .User.ID}}
  <nav>
    <a href="/">unread</a>
    <a href="/feeds">feeds</a>
    <a href="/authors">authors</a>
    <a href="/collections">collections</a>
    <a href="/favorites">favorites</a>
    <div class="user-menu">
      <button type="button" id="user-menu-btn" class="avatar-btn" aria-haspopup="true" aria-expanded="false" title="{{.User.Username}}" onclick="toggleUserMenu(event)">
        {{if .User.HasAvatar}}<img class="avatar avatar-sm" src="/avatar" alt="{{.User.Username}}">{{else}}<span class="avatar avatar-sm avatar-default">{{initial .User.Username}}</span>{{end}}
      </button>
      <div id="user-menu" class="user-menu-pop" role="menu" hidden>
        <a href="/read" role="menuitem">history</a>
        <a href="/settings" role="menuitem">settings</a>
        <form action="/logout" method="post"><button class="link menu-item" type="submit">log out</button></form>
      </div>
    </div>
  </nav>
  {{end}}
</header>

<dialog id="item-dialog" class="modal wide">
  <div class="row">
    <h2 class="muted">item</h2>
    <div class="row-actions">
      <a id="item-dialog-live" class="small external" href="#" target="_blank" rel="noopener">open live</a>
      <button type="button" class="link" onclick="document.getElementById('item-dialog').close()">✕</button>
    </div>
  </div>
  <div id="item-dialog-body" class="item-view"></div>
</dialog>
<script>
var currentItemId = null;
function openItem(el) {
  currentItemId = el.dataset.itemId;
  document.getElementById('item-dialog-live').href = el.dataset.itemLink;
  var body = document.getElementById('item-dialog-body');
  body.innerHTML = '<p class="muted">loading…</p>';
  fetch('/items/' + el.dataset.itemId + '/view')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      body.innerHTML = html;
      markRowRead(el.dataset.itemId);
    })
    .catch(function () { body.innerHTML = '<p class="error">could not load item</p>'; });
  document.getElementById('item-dialog').showModal();
  return false;
}
function markRowRead(id) {
  var row = document.getElementById('item-' + id);
  if (!row) return;
  var title = row.querySelector('.item-title');
  if (title) title.classList.remove('unread');
  var btn = row.querySelector('.read-btn');
  if (btn) {
    btn.textContent = '↺';
    btn.setAttribute('title', 'mark unread');
  }
}
function toggleUserMenu(e) {
  e.stopPropagation();
  var menu = document.getElementById('user-menu');
  var btn = document.getElementById('user-menu-btn');
  var open = menu.hidden;
  menu.hidden = !open;
  if (btn) btn.setAttribute('aria-expanded', String(open));
}
document.addEventListener('click', function (e) {
  var menu = document.getElementById('user-menu');
  var btn = document.getElementById('user-menu-btn');
  if (!menu || menu.hidden) return;
  if (!e.target.closest('.user-menu')) {
    menu.hidden = true;
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var menu = document.getElementById('user-menu');
    var btn = document.getElementById('user-menu-btn');
    if (menu && !menu.hidden) {
      menu.hidden = true;
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var dialog = document.getElementById('item-dialog');
  if (!dialog || !dialog.open || !currentItemId) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  var current = document.getElementById('item-' + currentItemId);
  if (!current) return;
  var list = current.closest('ul.items') || current.parentElement;
  var items = Array.prototype.slice.call(list.querySelectorAll('li[id^="item-"]'));
  var idx = items.indexOf(current);
  var next = e.key === 'ArrowRight' ? items[idx + 1] : items[idx - 1];
  if (!next) return;
  var link = next.querySelector('[data-item-id]');
  if (!link) return;
  e.preventDefault();
  openItem(link);
});
</script>
{{end}}
