{{define "item_view"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Data.Title}}</title>
<style>
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; color: #e6e8ee; background: #111318; }
.wrap { max-width: 46rem; margin: 1.5rem auto; padding: 0 1.25rem; }
h1 { font-size: 1.4rem; line-height: 1.3; }
.meta { color: #9aa3b2; font-size: 0.85rem; }
a { color: #5b8cff; }
img { max-width: 100%; height: auto; }
pre { overflow-x: auto; padding: 0.75rem; background: #1a1e26; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{.Data.Title}}</h1>
  <p class="meta">{{.Data.AuthorName}} · <a href="{{.Data.FeedURL}}">{{.Data.FeedTitle}}</a>{{if .Data.PublishedAt}} · {{.Data.PublishedAt | timeFmt}}{{end}}</p>
  {{.Data.Body}}
</div>
</body>
</html>
{{end}}
