{{define "collections"}}
<!DOCTYPE html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "topbar" .}}
<main>
<div class="row">
  <h1>collections</h1>
  <button type="button" onclick="document.getElementById('add-collection-dialog').showModal()">+ add collection</button>
</div>
{{template "collections_list" .Data}}

<dialog id="add-collection-dialog" class="modal">
  <form class="stack" hx-post="/collections" hx-target="#collections-list" hx-swap="beforeend"
        hx-on::after-request="if(event.detail.successful && event.detail.elt === this){this.closest('dialog').close();this.reset()}">
    <div class="row">
      <h2>add collection</h2>
      <button type="button" class="link" onclick="this.closest('dialog').close()">✕</button>
    </div>
    <label>name
      <input name="name" autofocus required>
    </label>
    <div id="add-collection-error" class="error"></div>
    <button type="submit">add collection</button>
  </form>
</dialog>
</main>
</body>
</html>
{{end}}

{{define "collections_list"}}
<ul class="plain" id="collections-list">
  {{range .}}
  {{template "collection_row" .}}
  {{end}}
</ul>
{{end}}

{{define "collection_row"}}
<li id="collection-{{.ID}}">
  <div class="row">
    <a href="/collections/{{.ID}}"><strong>{{.Name}}</strong></a>
    <button class="link danger" title="delete" hx-post="/collections/{{.ID}}/delete" hx-target="#collection-{{.ID}}" hx-swap="outerHTML" hx-confirm="delete this collection?">✕</button>
  </div>
</li>
{{end}}
