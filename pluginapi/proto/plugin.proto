syntax = "proto3";

package nanoflux.plugin.v1;

option go_package = "github.com/metruzanca/nanoflux/pluginapi/gen;pluginpb";

// ---- Host service: served by nanoflux, called by the plugin ----

service Host {
  rpc Do(HTTPRequest) returns (HTTPResponse);
  rpc Now(NowRequest) returns (NowResponse);
  rpc Log(LogRequest) returns (LogResponse);
}

message HTTPRequest {
  string method = 1;
  string url = 2;
  map<string, string> headers = 3;
  bytes body = 4;
}

message HTTPResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  bool rate_limited = 4;
  int64 retry_after_millis = 5;
}

message NowRequest {}
message NowResponse { int64 unix_millis = 1; }

message LogRequest { string message = 1; }
message LogResponse {}

// ---- Fetcher service: served by the plugin, called by nanoflux ----

service Fetcher {
  rpc Meta(MetaRequest) returns (MetaResponse);
  rpc Match(MatchRequest) returns (MatchResponse);
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Render(RenderRequest) returns (RenderResponse);
  // Docs is optional: a plugin that does not implement Docser answers with an
  // unsupported PluginError, which the host treats as "no documentation".
  rpc Docs(DocsRequest) returns (DocsResponse);
  // SharedKeys is optional: ingest-time per-item cross-feed identity.
  rpc SharedKeys(SharedKeyRequest) returns (SharedKeyResponse);
  // Enrich is optional: ingest-time per-item body enrichment (full text,
  // translation, transcript).
  rpc Enrich(EnrichRequest) returns (EnrichResponse);
  // Decorate is optional: view-time per-item rendering (attribution, kind).
  rpc Decorate(DecorateRequest) returns (DecorateResponse);
  // URLPolicy methods are optional: a site's pure URL rules (canonical shape,
  // feed token), so site-specific handling lives in the plugin.
  rpc CanonicalizeFeedURL(CanonicalizeFeedURLRequest) returns (CanonicalizeFeedURLResponse);
  rpc FeedToken(FeedTokenRequest) returns (FeedTokenResponse);
  // Provision is optional: create a feed on the remote service on the user's
  // behalf (a Kill the Newsletter inbox). Advertised by a non-empty
  // Meta.provision_label.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  // FeedSettings is optional: the display-only fields for an already-subscribed
  // feed (the inbox address), pure and without network I/O.
  rpc FeedSettings(FeedSettingsRequest) returns (FeedSettingsResponse);
  // FeedAction is optional: manage an already-subscribed feed's remote settings
  // and lifecycle (sync a title, delete it upstream).
  rpc FeedAction(FeedActionRequest) returns (FeedActionResponse);
  // SettingsSchema is optional: the configuration fields the plugin needs, so
  // the host can render a form. Pure, no network I/O.
  rpc SettingsSchema(SettingsSchemaRequest) returns (SettingsSchemaResponse);
  // Configure is optional: the host pushes the stored configuration values to
  // the plugin. Called at load and whenever an admin saves the form.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message MetaRequest {}
message MetaResponse {
  string name = 1;
  string api_version = 2;
  bool raw_network = 3;
  string user_agent = 4;
  // One-line description shown on the plugin's admin card.
  string summary = 5;
  // Whether the plugin implements Docser. Filled by the host, not authored.
  bool has_docs = 6;
  // Non-empty advertises the plugin as a create option in the add-feed menu.
  string provision_label = 7;
  // Whether the plugin implements FeedAdmin. Filled by the host, not authored.
  bool has_feed_admin = 8;
  // Whether the plugin implements Configurable. Filled by the host, not authored.
  bool has_settings = 9;
}

message MatchRequest {
  string url = 1;
  // 0 = discover, 1 = fetch, 2 = render, 3 = docs, 4 = shared keys, 5 = decorate,
  // 6 = url policy, 7 = enrich, 8 = provision, 9 = feed admin, 10 = image cache.
  // New capabilities are appended, never inserted: the value crosses the wire as
  // an integer.
  int32 capability = 2;
}
message MatchResponse { bool match = 1; }

message Candidate {
  string feed_url = 1;
  string title = 2;
  string icon_url = 3;
  string home_url = 4;
  // Preferred new-author name when the site suggests one different from the
  // feed title (reddit users: "spez" rather than "u/spez").
  string author_name = 5;
  // The feed URL follows from the page URL alone; the host must not fetch the
  // page to validate the feed or gather its metadata (reddit's tight limit).
  bool derived = 6;
}

message DiscoverRequest {
  uint32 host_server = 1;
  string page_url = 2;
}
message DiscoverResponse {
  repeated Candidate candidates = 1;
  PluginError error = 2;
}

message Enclosure {
  string url = 1;
  string mime_type = 2;
  int64 length = 3;
  // Declared render kind (see pluginapi.EnclosureKind*). Empty = host infers.
  string kind = 4;
  // Thumbnail for a video/audio enclosure. Empty = item's image_url.
  string poster = 5;
  // Human label for the enclosure's download link.
  string title = 6;
}

message Item {
  string guid = 1;
  string title = 2;
  string link = 3;
  string summary = 4;
  string image_url = 5;
  string published_at = 6;
  repeated Enclosure enclosures = 7;
  // Stable per-feed dedup key. Empty means "use guid". Set it when guid may
  // change shape for the same entry over time.
  string identity = 8;
  // Media runtime in seconds (a video's length). 0 means unknown.
  int32 duration_sec = 9;
  // Feed-provided labels the host stores and matches filter rules against.
  repeated string categories = 10;
  // Identity shared across a user's feeds (set by a SharedKeyer; e.g.
  // "reddit:t3_<id>"). Empty means not cross-deduplicated.
  string shared_key = 11;
}

message Feed {
  string title = 1;
  string home_url = 2;
  string description = 3;
  string image_url = 4;
}

message FetchRequest {
  uint32 host_server = 1;
  string url = 2;
  string etag = 3;
  string last_modified = 4;
  bytes config = 5;
}
message FetchResponse {
  Feed feed = 1;
  repeated Item items = 2;
  string etag = 3;
  string last_modified = 4;
  string next_page_url = 5;
  PluginError error = 6;
}

// Render resolves an item's view-time media (an embed player, gallery images,
// or an external source link) that cannot be carried on a stored Item.

message RenderRequest {
  uint32 host_server = 1;
  string link = 2;
  string summary = 3;
  string image_url = 4;
  bytes config = 5;
  string guid = 6;
  int32 kind = 7;
  repeated string categories = 8;
  repeated Enclosure enclosures = 9;
}
message RenderResponse {
  string source_url = 1;
  string embed_src = 2;
  repeated string gallery = 3;
  PluginError error = 4;
}

// Docs returns the plugin's Markdown documentation. An unsupported PluginError
// means the plugin has none.

message DocsRequest {}
message DocsResponse {
  string docs = 1;
  PluginError error = 2;
}

// SharedKeys is the optional ingest-time hook: the host offers a feed's parsed
// items and the plugin returns each item's cross-feed SharedKey (or none).

message SharedKeyRequest {
  uint32 host_server = 1;
  string feed_url = 2;
  Feed feed = 3;
  repeated Item items = 4;
}
message ItemSharedKey {
  int32 index = 1;
  string shared_key = 2;
}
message SharedKeyResponse {
  repeated ItemSharedKey entries = 1;
  PluginError error = 2;
}

// Enrich is the optional ingest-time content hook: the host offers newly stored
// items and the plugin returns an enriched body for each it can resolve.

message EnrichRequest {
  uint32 host_server = 1;
  repeated Item items = 2;
}
message Enriched {
  int32 index = 1;
  string content = 2;
}
message EnrichResponse {
  repeated Enriched enriched = 1;
  PluginError error = 2;
}

// Decorate is the optional view-time hook: the host offers a page's stored
// items and the plugin returns per-item rendering (attribution parts and kind).

message SourcePart {
  string text = 1;
  string token = 2;
  string url = 3;
}
message Decorated {
  int32 index = 1;
  // 0 = text, 1 = image, 2 = gallery, 3 = link, 4 = video, 5 = audio
  int32 kind = 2;
  repeated SourcePart attribution = 3;
  string thumb_url = 4;
  // View-time content identity for cross-feed dedup: two items with the same
  // key collapse into one row. Empty means "dedupe by title only".
  string dedupe_key = 5;
}
message DecorateRequest {
  repeated Item items = 1;
}
message DecorateResponse {
  repeated Decorated decorations = 1;
  PluginError error = 2;
}

// URLPolicy methods are optional: pure site URL rules.

message CanonicalizeFeedURLRequest { string url = 1; }
message CanonicalizeFeedURLResponse {
  string url = 1;
  PluginError error = 2;
}
message FeedTokenRequest { string feed_url = 1; }
message FeedTokenResponse {
  string token = 1;
  PluginError error = 2;
}

// PluginError carries a structured failure back to the host so it can map it
// (e.g. an HTTP status to a user-facing reason, or a rate limit to a backoff).
message PluginError {
  int32 status_code = 1;
  int64 retry_after_millis = 2;
  bool rate_limited = 3;
  bool unsupported = 4;
  string message = 5;
}

// Provision creates a feed on the remote service on the user's behalf.

message ProvisionRequest {
  uint32 host_server = 1;
  string title = 2;
}
message Field {
  string name = 1;
  string label = 2;
  string value = 3;
  string kind = 4;
}
message Provisioned {
  string feed_url = 1;
  string title = 2;
  string home_url = 3;
  repeated Field fields = 4;
}
message ProvisionResponse {
  Provisioned provisioned = 1;
  PluginError error = 2;
}

// FeedSettings returns the display-only fields for an already-subscribed feed.
// It is pure: no host is dialed.

message FeedSettingsRequest { string feed_url = 1; }
message FeedSettingsResponse {
  repeated Field fields = 1;
  PluginError error = 2;
}

// SettingsSchema / Configure: a plugin's configuration fields and the stored
// values the host pushes back. SettingsSchema is pure; Configure carries values
// keyed by SettingField.name.

message SettingField {
  string name = 1;
  string label = 2;
  string kind = 3;
  string placeholder = 4;
  string help = 5;
  bool required = 6;
}
message SettingsSchemaRequest {}
message SettingsSchemaResponse {
  repeated SettingField fields = 1;
  PluginError error = 2;
}
message ConfigureRequest { map<string, string> values = 1; }
message ConfigureResponse { PluginError error = 2; }

// FeedAction manages an already-subscribed feed's remote settings and lifecycle.

message FeedActionRequest {
  uint32 host_server = 1;
  string feed_url = 2;
  string action = 3;
  map<string, string> fields = 4;
}
message FeedActionResult {
  string message = 1;
  bool deleted = 2;
  repeated Field fields = 3;
}
message FeedActionResponse {
  FeedActionResult result = 1;
  PluginError error = 2;
}
