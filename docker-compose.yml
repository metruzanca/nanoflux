# Pin the project name and the volume names explicitly. Without `name:`, compose
# derives the project from the checkout directory's basename, so moving or
# renaming the repo silently points every command at a brand-new, empty set of
# volumes — the running instance is orphaned while its data looks lost. The
# explicit volume names also make them stable across checkouts and match the
# names `make backup`/`make restore` mount.
name: nanoflux

services:
  nanoflux:
    # Default to a locally built image (Dockerfile.local, from this checkout).
    # `make start REGISTRY=ghcr` or setting NANOFLUX_IMAGE in .env switches to a
    # published image; the build block is then unused.
    image: ${NANOFLUX_IMAGE:-nanoflux:local}
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        VERSION: ${NANOFLUX_VERSION:-dev}
    ports:
      - "20310:8080"
    environment:
      NF_ADDR: ":8080"
      NF_DB: "/data/rss.db"
      NF_FILE_STORE: "/filestore"
      # There is no admin account by default: the first person to sign up on a
      # fresh install becomes the admin, and signups then close. Re-open them
      # from the admin page, or create/recover an admin with the CLI:
      #   docker compose run --rm nanoflux user create you --admin
      # Refuse to reach private/loopback addresses when fetching feeds unless
      # your feeds live on your LAN.
      NF_ALLOW_PRIVATE_FETCH: "${NF_ALLOW_PRIVATE_FETCH:-}"
      # Automatic filesystem backups, on by default. The server snapshots the
      # database and file store into ./backups on the host once a day, keeping
      # the newest seven. Set NF_BACKUP_INTERVAL=0 in .env to turn them off, or
      # point NF_BACKUP_DIR at another path to move them (it must be a mount to
      # survive container recreation).
      NF_BACKUP_DIR: "${NF_BACKUP_DIR:-/backups}"
      NF_BACKUP_INTERVAL: "${NF_BACKUP_INTERVAL:-24h}"
      NF_BACKUP_KEEP: "${NF_BACKUP_KEEP:-7}"
      # External feed plugins are executables in this directory; drop them in
      # ./plugins on the host and restart. Native plugins (YouTube, etc.) are
      # always available.
      NF_PLUGINS_DIR: "${NF_PLUGINS_DIR:-/plugins}"
    volumes:
      - nanoflux-db:/data
      - nanoflux-files:/filestore
      # Same host directory `make backup` writes to and `make restore` reads
      # from, so a snapshot the server takes can be restored with `make restore`.
      - ./backups:/backups
      # External feed plugins (see docs/writing-plugins.md).
      - ./plugins:/plugins
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nanoflux-db:
    name: nanoflux-db
  nanoflux-files:
    name: nanoflux-files
