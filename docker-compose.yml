services:
  nanoflux:
    image: ghcr.io/metruzanca/nanoflux:latest
    ports:
      - "20310:8080"
    environment:
      NF_ADDR: ":8080"
      NF_DB: "/data/rss.db"
      NF_FILE_STORE: "/filestore"
      # Set these in a .env file to create the first account at startup;
      # otherwise the default admin/admin account is created.
      NF_ADMIN_USER: "${NF_ADMIN_USER:-}"
      NF_ADMIN_PASS: "${NF_ADMIN_PASS:-}"
    volumes:
      - nanoflux-db:/data
      - nanoflux-files:/filestore
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nanoflux-db:
  nanoflux-files:
