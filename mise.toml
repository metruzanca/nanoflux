[tasks.gen]
description = "Regenerate templ components and sqlc queries"
run = "templ generate && sqlc generate"

[tasks."pluginapi:gen"]
description = "Regenerate pluginapi gRPC code (buf; needs buf + protoc-gen-go{,-grpc})"
run = "cd pluginapi && buf generate"

[tasks.icons]
description = "Regenerate the pwa + extension icons"
run = "go run ./tools/iconsgen"

[tasks.extension]
description = "Package the browser extension into dist/"
run = "go run ./tools/extzip"

[tasks."vendor:vaadin"]
description = "Bundle the pinned Vaadin combo-box components into static/ (needs node)"
run = "./tools/vaadin-vendor/vendor.sh"

[tasks.dev]
description = "Watch Go sources and rerun the server on change"
run = "mise watch -r dev-serve"

[tasks.dev-serve]
hide = true
description = "Regenerate templates/queries and run the RSS server"
run = "templ generate && go run cmd/server/main.go"
sources = ["**/*.go", "**/*.templ", "internal/web/static/**", "go.mod", "go.sum"]