{{ define "main" }}
<div class="page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ with .Pages }}
  <ul class="post-list">
    {{ range . }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2 January 2006" }}</time>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
